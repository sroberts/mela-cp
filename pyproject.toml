[project]
name = "mela-cp"
version = "0.1.0"
description = "A local MCP server for Mela recipes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
mela-cp = "mela_cp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mela_cp"]
